name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  VITE_API_URL: https://api.statzonepro.com
  VITE_WS_URL: https://api.statzonepro.com/ws

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statezone-backend

    env:
      DB_USERNAME: test
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compile
        run: mvn compile -q
      - name: Test
        run: mvn test

  deploy:
    needs: backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy do Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK não configurado. O backend continua no deploy manual."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statezone-frontend

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: statezone-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Type check & Build
        run: npm run build
      - name: Test
        run: npm test
