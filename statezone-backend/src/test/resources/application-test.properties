spring.datasource.url=jdbc:h2:mem:statzonetest;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Make cookies non-secure for tests
app.security.cookie-secure=false
app.security.allowed-origins=http://localhost:5173

logging.level.root=INFO

spring.jpa.open-in-view=false

# JWT for tests (base64 key)
jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=1209600000

# Disable external API keys in tests
api-football.api-key=TESTKEY
api-football.base-url=https://v3.football.api-sports.io
