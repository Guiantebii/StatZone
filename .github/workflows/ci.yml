name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  VITE_API_URL: https://api.statzonepro.com
  VITE_WS_URL: https://api.statzonepro.com/ws

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statezone-backend

    env:
      DB_USERNAME: test
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compile
        run: mvn compile -q
      - name: Test
        shell: bash
        run: |
          mvn test -e 2>&1 | tee test-output.log
      - name: Show failure
        if: failure()
        shell: bash
        run: |
          msg=""
          add_line() { msg="${msg}%0A$1"; }
          add_line "=== Test Summary ==="
          add_line "$(grep -E "Tests run:" test-output.log | tail -1 || echo '(no summary)')"
          add_line "=== AuthFlowIntegrationTest error ==="
          while IFS= read -r line; do
            add_line "$line"
          done <<< "$(grep -n -A 20 "AuthFlowIntegrationTest" test-output.log | head -30 || echo '(no error context)')"
          add_line "=== Placeholder errors ==="
          while IFS= read -r line; do
            add_line "$line"
          done <<< "$(grep -n -i "placeholder\|Could not resolve" test-output.log | head -15 || echo '(none)')"
          echo "::error::$msg"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statezone-frontend

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: statezone-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check & Build
        run: npm run build
      - name: Test
        run: npm test
