app.security.cookie-secure=true
app.security.cookie-same-site=Strict
app.security.allowed-origins=${ALLOWED_ORIGINS:https://statezone.vercel.app}

app.websocket.allowed-origins=${ALLOWED_ORIGINS:https://statezone.vercel.app}

spring.jpa.show-sql=false
server.error.include-stacktrace=never

rate-limiting.enabled=true
rate-limiting.max-requests=100
rate-limiting.window-seconds=60
