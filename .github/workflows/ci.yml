name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  VITE_API_URL: https://api.statzonepro.com
  VITE_WS_URL: https://api.statzonepro.com/ws

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statezone-backend

    env:
      DB_USERNAME: test
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compile
        run: mvn compile -q
      - name: Test
        shell: bash
        run: |
          mvn test -e 2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}
      - name: Show test output
        if: always()
        shell: bash
        run: |
          echo "=== Test Summary Lines ==="
          grep -n -E "Tests run:|BUILD|FAILURE|FAIL" test-output.log || echo "(none found)"
          echo "=== Errors (if any) ==="
          grep -n -B2 -A2 "Tests run.*Failures: [1-9]\|Tests run.*Errors: [1-9]\|COMPILATION ERROR\|BUILD FAILURE" test-output.log || echo "(no failures detected in summary)"
          # Use GitHub Actions annotations
          grep "BUILD FAILURE" test-output.log && echo "::error::BUILD FAILURE detected" || true
          grep "COMPILATION ERROR" test-output.log && echo "::error::COMPILATION ERROR detected" || true
          grep -E "Tests run:.*Failures: [1-9]" test-output.log && echo "::error::Test failures detected" || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statezone-frontend

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: statezone-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check & Build
        run: npm run build
      - name: Test
        run: npm test
