app.security.cookie-secure=true
app.security.allowed-origins=${ALLOWED_ORIGINS:https://statezone.vercel.app}

app.websocket.allowed-origins=${ALLOWED_ORIGINS:https://statezone.vercel.app}

spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.data-source-properties.prepareThreshold=0
server.address=0.0.0.0
server.error.include-stacktrace=never

rate-limiting.enabled=true
rate-limiting.trust-proxy=true

app.registration.enabled=false
app.swagger.public=false
app.demo.seed=true
app.demo.email=demo@statzone.dev
app.demo.password=portfolio
rate-limiting.max-requests=100
rate-limiting.window-seconds=60
