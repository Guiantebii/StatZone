name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  VITE_API_URL: https://api.statzonepro.com
  VITE_WS_URL: https://api.statzonepro.com/ws

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statezone-backend

    env:
      DB_USERNAME: test
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compile
        run: mvn compile -q
      - name: Test
        shell: bash
        run: |
          mvn test -e 2>&1 | tee test-output.log
      - name: Show failure
        if: failure()
        shell: bash
        run: |
          msg="=== Test Summary ===%0A"
          msg="${msg}$(grep -E 'Tests run:' test-output.log | tail -1 || echo '(no summary)')%0A"
          msg="${msg}=== Context load error ===%0A"
          lineno=$(grep -n "AuthFlowIntegrationTest" test-output.log | head -1 | cut -d: -f1)
          if [ -n "$lineno" ]; then
            context=$(sed -n "${lineno},$((lineno + 120))p" test-output.log)
            msg="${msg}${context}%0A"
          fi
          echo "::error::$msg"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statezone-frontend

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: statezone-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check & Build
        run: npm run build
      - name: Test
        run: npm test
