services:
  - type: web
    name: statezone-backend
    runtime: image
    repo: https://github.com/SEU_USUARIO/REPOSITORIO
    plan: free
    dockerfilePath: ./statezone-backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://SEU_HOST:5432/statezone
      - key: DB_USERNAME
        value: SEU_USER
      - key: DB_PASSWORD
        value: SUA_SENHA
      - key: ALLOWED_ORIGINS
        value: https://statezone.vercel.app
      - key: JWT_SECRET
        generateValue: true
        length: 44
      - key: JWT_EXPIRATION_MS
        value: 3600000
      - key: JWT_REFRESH_EXPIRATION_MS
        value: 1209600000
      - key: API_FOOTBALL_KEY
        sync: false
