name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  VITE_API_URL: https://api.statzonepro.com
  VITE_WS_URL: https://api.statzonepro.com/ws

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statezone-backend

    env:
      DB_USERNAME: test
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compile
        run: mvn compile -q
      - name: Test
        shell: bash
        run: |
          mvn test -e 2>&1 | tee test-output.log
          exit_code=${PIPESTATUS[0]}
          # Also check surefire reports for granular detail
          if [ -d target/surefire-reports ]; then
            for report in target/surefire-reports/*.xml; do
              if grep -q 'failures="[1-9]\|errors="[1-9]' "$report" 2>/dev/null; then
                test_name=$(basename "$report" .xml)
                failures=$(grep -o 'failures="[0-9]*"' "$report" | grep -o '[0-9]*')
                errors=$(grep -o 'errors="[0-9]*"' "$report" | grep -o '[0-9]*')
                echo "::error::FAILED TEST: $test_name (failures=$failures errors=$errors)"
              fi
            done
          fi
          exit $exit_code
      - name: Summarize failures
        if: failure()
        shell: bash
        run: |
          echo "=== Surefire reports ==="
          if [ -d target/surefire-reports ]; then
            for f in target/surefire-reports/*.txt; do
              [ -f "$f" ] && echo "--- $(basename $f) ---" && cat "$f"
            done
          fi
          echo "=== Test Output Summary ==="
          grep -E "Tests run:|BUILD|FAILURE|ERROR|COMPILATION" test-output.log || echo "(no summary found)"
          echo "=== Last 20 lines ==="
          tail -20 test-output.log

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statezone-frontend

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: statezone-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check & Build
        run: npm run build
      - name: Test
        run: npm test
